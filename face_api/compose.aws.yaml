services:
  backend:
    environment:
      FACE_API_URL: http://face-api:8080
      FACE_API_TIMEOUT: "600"
      COOKIE_SECURE: "1"
      MAX_UPLOAD_MB: "25"
      MEDIA_BASE_URL: "https://${API_HOST:?Set API_HOST}/media"
      CORS_ORIGINS: "${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}"

  caddy:
    image: caddy:2-alpine
    environment:
      API_HOST: "${API_HOST:?Set API_HOST}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
